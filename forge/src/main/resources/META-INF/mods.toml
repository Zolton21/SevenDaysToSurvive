modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "${issue_tracker_url}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName="${mod_name}"
logoFile="logo1.png"
authors = "${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "sevendaystosurvive.mixins.json"

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId="geckolib"
mandatory=true
versionRange="${geckolib_version}"
ordering="NONE"
side="BOTH"
