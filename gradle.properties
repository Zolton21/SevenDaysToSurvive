#Mod Information
mod_id=sevendaystosurvive
mod_name=Seven Days To Survive
mod_authors=Zolton21
mod_description=Seven Days to Survive is a difficulty overhaul mod that significantly enhances the challenge of survival by improving the AI of vanilla Minecraft zombies. Their detection range is greatly increased, and they have gained the ability to dig and place blocks, making them relentless in their pursuit of the player. No longer will walls or terrain keep you safe - zombies will actively tunnel, build, and navigate obstacles to reach you.
